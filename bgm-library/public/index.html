<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>BGMライブラリ管理</title>
<style>
  body { font-family: "Segoe UI", "Meiryo", sans-serif; background: #1b1d23; color: #e8e8e8; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h2 { font-size: 16px; margin-top: 32px; border-bottom: 1px solid #444; padding-bottom: 4px; }
  section { max-width: 960px; margin: 0 auto; }
  .card { background: #262933; border-radius: 8px; padding: 16px; margin-top: 12px; }
  label { display: block; font-size: 12px; color: #aaa; margin-top: 8px; }
  input[type=text], input[type=file] { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 4px; border: 1px solid #444; background: #1b1d23; color: #eee; }
  button { cursor: pointer; border: none; border-radius: 4px; padding: 6px 12px; background: #4f7cff; color: #fff; font-size: 13px; margin-top: 8px; }
  button.secondary { background: #444; }
  button.danger { background: #b3453f; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { border-bottom: 1px solid #383b45; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { color: #999; font-weight: normal; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; background: #7a5c00; color: #ffd873; }
  .row-inline { display: flex; gap: 8px; align-items: center; }
  .spotify-results div { padding: 4px 6px; cursor: pointer; border-radius: 4px; }
  .spotify-results div:hover { background: #333; }
  .muted { color: #888; font-size: 12px; }
  select { padding: 4px; border-radius: 4px; background: #1b1d23; color: #eee; border: 1px solid #444; }
  .program-item {
    display: flex; gap: 8px; align-items: flex-start;
    background: #20222b; border: 1px solid #383b45; border-radius: 8px;
    padding: 14px; margin-top: 10px;
  }
  .program-item input[type=text] { width: 220px; }
  .program-item-main { flex: 1; }
  .program-item-main select { width: 100%; margin-top: 6px; box-sizing: border-box; }
  .program-item input.section-field { width: 160px; }
  .playlist-preview { margin-top: 6px; font-size: 12px; color: #9fd6a8; }
  .playlist-preview.empty { color: #888; }
  .playlist-picker-label { display: block; font-size: 11px; color: #888; margin-top: 10px; letter-spacing: 0.02em; }
  .program-section { margin-top: 14px; }
  .program-section-header {
    display: flex; align-items: center; gap: 8px;
    background: #262933; border: 1px solid #383b45; border-radius: 8px 8px 0 0;
    padding: 8px 14px;
  }
  .program-section.collapsed .program-section-header { border-radius: 8px; }
  .program-section-header .section-toggle {
    background: none; margin: 0; padding: 0 4px; font-size: 14px; color: #9fd6a8;
  }
  .program-section-header strong { flex: 1; font-size: 13px; }
  .program-section-header button.secondary, .program-section-header button.danger { margin: 0; padding: 3px 8px; font-size: 11px; }
  .program-section-body { border: 1px solid #383b45; border-top: none; border-radius: 0 0 8px 8px; padding: 1px 14px 10px; }
  .program-section-body .program-item:first-child { margin-top: 10px; }
  .program-section.collapsed .program-section-body { display: none; }
  .bgm-playlist { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .bgm-chip { display: flex; align-items: center; gap: 6px; background: #1b1d23; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; font-size: 12px; }
  .bgm-chip .bgm-chip-title { flex: 1; }
  .bgm-chip button { margin: 0; padding: 1px 6px; font-size: 11px; }
  .bgm-add-row { display: flex; gap: 6px; margin-top: 4px; align-items: center; }
  .playlist-card {
    background: #20222b; border: 1px solid #383b45; border-radius: 8px;
    padding: 14px; margin-top: 10px;
  }
  .playlist-card .row-inline { margin-top: 6px; }
  .playlist-card input[type=text] { width: auto; flex: 1; }
  .pl-loop-label { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: #aaa; }
  .pl-loop-label input[type=checkbox] { width: auto; }
  .playlist-total { margin-top: 8px; font-size: 12px; color: #9fd6a8; }
  button.preview-play { background: #2f8f5b; margin-top: 0; padding: 4px 10px; min-width: 34px; }
  button.preview-play.playing { background: #b3453f; }
  tr.track-child-row { background: #20222b; }
  tr.track-child-row td { border-bottom-color: #2c2f38; }
  tr.track-child-row + tr:not(.track-child-row) td { border-top: 2px solid #383b45; }
  .child-indicator { font-size: 11px; color: #7de1ff; margin-bottom: 2px; padding-left: 14px; }
</style>
</head>
<body>
<section>
  <h1>BGMライブラリ管理</h1>
  <p class="muted">アップロードした曲はUUIDファイル名で保存され、曲名・表示用曲名(伏字対応)・作者・注記を管理できます。</p>

  <h2>YouTubeからダウンロード</h2>
  <div class="card">
    <label>YouTube URL</label>
    <div class="row-inline">
      <input type="text" id="yt-url" placeholder="https://www.youtube.com/watch?v=..." style="flex:1;" />
      <button class="secondary" id="btn-yt-info" type="button">情報取得</button>
    </div>
    <span class="muted" id="yt-info-status"></span>

    <label>曲名</label>
    <input type="text" id="yt-title" placeholder="情報取得すると自動入力されます(編集可)" />

    <label>作者</label>
    <input type="text" id="yt-author" placeholder="投稿者名が自動入力されます(編集可)" />

    <label>表示用曲名 (空欄なら曲名と同じ)</label>
    <input type="text" id="yt-display" placeholder="例: ■■■■&U" />

    <label><input type="checkbox" id="yt-arranged" style="width:auto;display:inline-block;vertical-align:middle;" /> 当方でBGM化(編集・二次利用)した音源</label>

    <label>注記 (任意)</label>
    <input type="text" id="yt-note" placeholder="例: サビのみ抜粋" />

    <button id="btn-yt-download" type="button">ダウンロードしてライブラリに追加</button>
    <span class="muted" id="yt-download-status"></span>
    <p class="muted" style="margin-top:8px;">著作権・利用規約の確認は利用者側の責任で行ってください。</p>
  </div>

  <h2>ファイルをアップロード</h2>
  <div class="card">
    <label>音源ファイル (mp3 / wav / ogg)</label>
    <input type="file" id="f-file" accept=".mp3,.wav,.ogg" />

    <label>曲名 (内部管理用・フル表記)</label>
    <input type="text" id="f-title" placeholder="例: YAJU&U" />

    <div class="row-inline">
      <button class="secondary" id="btn-artist-search" type="button">作者を検索 (last.fm)</button>
      <span class="muted" id="artist-search-status"></span>
    </div>
    <div class="spotify-results" id="artist-search-results"></div>

    <label>作者</label>
    <input type="text" id="f-author" placeholder="例: MAOU" />

    <label>表示用曲名 (画面表示時。伏字にしたい場合はここを編集。空欄なら曲名と同じ)</label>
    <input type="text" id="f-display" placeholder="例: ■■■■&U" />

    <label><input type="checkbox" id="f-arranged" style="width:auto;display:inline-block;vertical-align:middle;" /> 当方でBGM化(編集・二次利用)した音源</label>

    <label>注記 (任意)</label>
    <input type="text" id="f-note" placeholder="例: サビのみ抜粋・ピッチ変更あり" />

    <button id="btn-upload" type="button">アップロード</button>
    <span class="muted" id="upload-status"></span>
  </div>

  <h2>登録済みの曲</h2>
  <div class="card">
    <table>
      <thead>
        <tr><th></th><th>表示用曲名</th><th>曲名(内部)</th><th>作者</th><th>注記</th><th></th><th></th></tr>
      </thead>
      <tbody id="library-body"></tbody>
    </table>
  </div>

  <h2>転換用プレイリスト</h2>
  <div class="card">
    <p class="muted">名前を付けたプレイリストを作っておき、下の「行事の次第」で各演目の転換に付け外しできます。同じプレイリストを複数の演目で使い回せます。</p>
    <div id="playlist-manager-list"></div>
    <button class="secondary" id="btn-add-playlist" type="button">プレイリストを新規作成</button>
  </div>

  <h2>行事の次第 (演目とBGMの割り当て)</h2>
  <div class="card">
    <div id="program-list"></div>
    <button class="secondary" id="btn-add-item" type="button">演目を追加</button>
    <button id="btn-save-program" type="button">次第を保存</button>
    <span class="muted" id="program-status"></span>
  </div>
</section>

<script>
let library = [];
let program = [];
let playlists = [];

// ------------------------------------------------------------
// 試し聞き (/tracks-file/<filename> を1つの<audio>で再生する。
// ボタンを押すたびに再生/一時停止をトグルし、別の曲を押すと切り替わる)
// ------------------------------------------------------------
const previewAudio = new Audio();
let previewTrackId = null;
previewAudio.addEventListener("ended", stopPreview);
previewAudio.addEventListener("pause", () => {
  if (previewAudio.currentTime === 0 || previewAudio.ended) stopPreview();
  else updatePreviewButtons();
});
previewAudio.addEventListener("play", updatePreviewButtons);

function updatePreviewButtons() {
  document.querySelectorAll("button[data-preview]").forEach(btn => {
    const isCurrent = btn.dataset.preview === previewTrackId && !previewAudio.paused;
    btn.textContent = isCurrent ? "⏸" : "▶";
    btn.classList.toggle("playing", isCurrent);
  });
}

function stopPreview() {
  previewAudio.pause();
  previewAudio.currentTime = 0;
  previewTrackId = null;
  updatePreviewButtons();
}

function togglePreview(id) {
  const track = library.find(t => t.id === id);
  if (!track) return;
  if (previewTrackId === id) {
    if (previewAudio.paused) {
      previewAudio.play().catch(() => { alert("再生に失敗しました"); stopPreview(); });
    } else {
      previewAudio.pause();
    }
    return;
  }
  previewAudio.src = `/tracks-file/${encodeURIComponent(track.filename)}`;
  previewTrackId = id;
  previewAudio.play().catch(() => {
    alert("再生に失敗しました");
    stopPreview();
  });
}

async function refreshLibrary() {
  library = await fetch("/api/tracks").then(r => r.json());
  renderLibrary();
  renderPlaylistManager();
  renderProgram();
}

async function refreshProgram() {
  program = await fetch("/api/program").then(r => r.json());
  renderProgram();
}

async function refreshPlaylists() {
  playlists = await fetch("/api/playlists").then(r => r.json());
  renderPlaylistManager();
  renderProgram();
}

function renderLibrary() {
  const body = document.getElementById("library-body");
  body.innerHTML = "";

  // ボーカル除去で生成された曲(sourceTrackIdを持つ)は、元曲の直下にぶら下げて
  // 親子関係が見えるように並べる(元曲が削除済みなら通常の曲として扱う)。
  const byId = Object.fromEntries(library.map(t => [t.id, t]));
  const childrenOf = {};
  for (const t of library) {
    if (t.sourceTrackId && byId[t.sourceTrackId]) {
      (childrenOf[t.sourceTrackId] = childrenOf[t.sourceTrackId] || []).push(t);
    }
  }
  const childIds = new Set(Object.values(childrenOf).flat().map(t => t.id));
  const ordered = [];
  for (const t of library) {
    if (childIds.has(t.id)) continue;
    ordered.push({ track: t, isChild: false });
    for (const child of (childrenOf[t.id] || [])) {
      ordered.push({ track: child, isChild: true });
    }
  }

  for (const { track: t, isChild } of ordered) {
    const tr = document.createElement("tr");
    if (isChild) tr.className = "track-child-row";
    tr.innerHTML = `
      <td><button class="preview-play" data-preview="${t.id}" type="button" title="試し聞き">▶</button></td>
      <td>
        ${isChild ? '<div class="child-indicator">↳ 改変済み</div>' : ''}
        <input type="text" value="${escapeAttr(t.displayTitle)}" data-field="displayTitle" data-id="${t.id}" />
      </td>
      <td><input type="text" value="${escapeAttr(t.title)}" data-field="title" data-id="${t.id}" /></td>
      <td><input type="text" value="${escapeAttr(t.author)}" data-field="author" data-id="${t.id}" /></td>
      <td>${t.arranged ? '<span class="badge">BGM化</span> ' : ''}<input type="text" value="${escapeAttr(t.note)}" data-field="note" data-id="${t.id}" /></td>
      <td><button class="secondary" data-devocal="${t.id}" ${activeVocalJobs[t.id] ? "disabled" : ""}>${devocalButtonLabel(t.id)}</button></td>
      <td><button class="danger" data-del="${t.id}">削除</button></td>
    `;
    body.appendChild(tr);
  }
  body.querySelectorAll("input[data-field]").forEach(inp => {
    inp.addEventListener("change", async () => {
      const id = inp.dataset.id, field = inp.dataset.field;
      await fetch(`/api/tracks/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ [field]: inp.value }),
      });
      await refreshLibrary();
    });
  });
  body.querySelectorAll("button[data-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("この曲を削除しますか?")) return;
      const r = await fetch(`/api/tracks/${btn.dataset.del}`, { method: "DELETE" }).then(r => r.json());
      if (r.warning) alert(r.warning);
      await refreshLibrary();
    });
  });
  body.querySelectorAll("button[data-preview]").forEach(btn => {
    btn.addEventListener("click", () => togglePreview(btn.dataset.preview));
  });
  body.querySelectorAll("button[data-devocal]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const trackId = btn.dataset.devocal;
      btn.disabled = true;
      btn.textContent = "開始中...";
      try {
        const res = await fetch(`/api/tracks/${trackId}/remove-vocals`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || "ボーカル除去に失敗しました");
          btn.disabled = false;
          btn.textContent = "ボーカル除去";
          return;
        }
        activeVocalJobs[trackId] = { jobId: data.jobId, progress: 0 };
        pollVocalRemovalJob(trackId, data.jobId);
      } catch (e) {
        alert("ボーカル除去に失敗しました");
        btn.disabled = false;
        btn.textContent = "ボーカル除去";
      }
    });
  });
  updatePreviewButtons();
}

// ------------------------------------------------------------
// ボーカル除去の進捗管理。実行中ジョブをtrackId単位で保持しておき、
// 曲の追加/編集などで一覧が再描画(renderLibrary)されてボタンのDOM要素が
// 作り直されても、進捗表示が消えずに引き継がれるようにする
// (ボタンのDOM参照を直接持ち回さず、毎回data-devocalで探し直す)。
// ------------------------------------------------------------
const activeVocalJobs = {}; // trackId -> { jobId, progress }

function devocalButtonLabel(trackId) {
  const job = activeVocalJobs[trackId];
  return job ? `処理中... ${job.progress}%` : "ボーカル除去";
}

function updateDevocalButton(trackId) {
  const btn = document.querySelector(`button[data-devocal="${trackId}"]`);
  if (!btn) return;
  const job = activeVocalJobs[trackId];
  btn.disabled = !!job;
  btn.textContent = devocalButtonLabel(trackId);
}

function pollVocalRemovalJob(trackId, jobId) {
  const tick = async () => {
    let job;
    try {
      job = await fetch(`/api/jobs/${jobId}`).then(r => r.json());
    } catch (e) {
      setTimeout(tick, 1500);
      return;
    }
    if (job.status === "running") {
      activeVocalJobs[trackId] = { jobId, progress: job.progress ?? 0 };
      updateDevocalButton(trackId);
      setTimeout(tick, 1000);
      return;
    }
    delete activeVocalJobs[trackId];
    if (job.status === "error") {
      alert(job.error || "ボーカル除去に失敗しました");
      updateDevocalButton(trackId);
      return;
    }
    // done
    await refreshLibrary();
  };
  tick();
}

// 結合プレイリスト(sourcePlaylistIdsで他のプレイリストを順番に繋げたもの)を
// 曲idの一次元リストに展開する。循環参照はそこで打ち切って空扱いにする
// (main.pyのload_playlists()と同じロジック)。
function resolvePlaylistTrackIds(allPlaylists, playlistId, ancestors) {
  ancestors = ancestors || new Set();
  if (ancestors.has(playlistId)) return [];
  const pl = allPlaylists.find(p => p.id === playlistId);
  if (!pl) return [];
  if (Array.isArray(pl.sourcePlaylistIds)) {
    const nextAncestors = new Set(ancestors);
    nextAncestors.add(playlistId);
    return pl.sourcePlaylistIds.flatMap(id => resolvePlaylistTrackIds(allPlaylists, id, nextAncestors));
  }
  return pl.trackIds || [];
}

function renderPlaylistManager() {
  const container = document.getElementById("playlist-manager-list");
  container.innerHTML = "";
  const libraryById = Object.fromEntries(library.map(t => [t.id, t]));
  const playlistById = Object.fromEntries(playlists.map(p => [p.id, p]));

  playlists.forEach((pl, i) => {
    const card = document.createElement("div");
    card.className = "playlist-card";

    // sourcePlaylistIdsが「配列として存在するか」で判定する(中身が空でも結合
    // モードとして扱う)。.lengthで判定すると、結合オンにした直後(まだ何も
    // 追加してない=空配列)のタイミングで再描画されるたびにOFFへ戻ってしまい、
    // チェックボックスがONにできないように見えるバグになっていた。
    const isCombined = Array.isArray(pl.sourcePlaylistIds);
    const trackIds = pl.trackIds || [];
    const resolvedTrackIds = isCombined ? resolvePlaylistTrackIds(playlists, pl.id) : trackIds;

    const chips = trackIds.map((id, ci) => {
      const t = libraryById[id];
      const label = t ? escapeHtml(t.title) : `(見つかりません: ${escapeHtml(id)})`;
      const dur = t && t.durationSec != null ? ` <span class="muted">(${formatDuration(t.durationSec)})</span>` : "";
      return `
        <div class="bgm-chip">
          <span class="muted">${ci + 1}.</span>
          <span class="bgm-chip-title">${label}${dur}</span>
          <button class="secondary" data-pl-chip-up="${i}:${ci}" type="button">↑</button>
          <button class="secondary" data-pl-chip-down="${i}:${ci}" type="button">↓</button>
          <button class="danger" data-pl-chip-remove="${i}:${ci}" type="button">×</button>
        </div>`;
    }).join("");

    const sourceIds = pl.sourcePlaylistIds || [];
    const sourceChips = sourceIds.map((id, ci) => {
      const sub = playlistById[id];
      const label = sub ? escapeHtml(sub.name || "(無題)") : `(見つかりません: ${escapeHtml(id)})`;
      const subDur = sub ? formatDuration(resolvePlaylistTrackIds(playlists, id).reduce((sum, tid) => {
        const d = libraryById[tid] && libraryById[tid].durationSec;
        return d != null ? sum + d : sum;
      }, 0)) : null;
      return `
        <div class="bgm-chip">
          <span class="muted">${ci + 1}.</span>
          <span class="bgm-chip-title">${label}${subDur ? ` <span class="muted">(${subDur})</span>` : ""}</span>
          <button class="secondary" data-pl-src-up="${i}:${ci}" type="button">↑</button>
          <button class="secondary" data-pl-src-down="${i}:${ci}" type="button">↓</button>
          <button class="danger" data-pl-src-remove="${i}:${ci}" type="button">×</button>
        </div>`;
    }).join("");

    const totalSec = resolvedTrackIds.reduce((sum, id) => {
      const d = libraryById[id] && libraryById[id].durationSec;
      return d != null ? sum + d : sum;
    }, 0);
    const unknownCount = resolvedTrackIds.filter(id => !libraryById[id] || libraryById[id].durationSec == null).length;
    const totalLabel = resolvedTrackIds.length
      ? `合計時間: ${formatDuration(totalSec)}${unknownCount ? ` (${unknownCount}曲は長さ不明)` : ""}`
      : "";

    const availableOptions = library.map(t =>
      `<option value="${t.id}">${escapeHtml(t.title)}</option>`
    ).join("");
    const availablePlaylistOptions = playlists
      .filter(p => p.id !== pl.id)
      .map(p => `<option value="${p.id}">${escapeHtml(p.name || "(無題)")}</option>`)
      .join("");

    card.innerHTML = `
      <div class="row-inline">
        <input type="text" value="${escapeAttr(pl.name || "")}" data-pl-idx="${i}" data-pl-field="name" placeholder="プレイリスト名 (例: 開幕BGM)" />
        <button class="danger" data-pl-delete="${pl.id}" type="button">削除</button>
      </div>
      <input type="text" value="${escapeAttr(pl.note || "")}" data-pl-idx="${i}" data-pl-field="note" placeholder="注記 (任意。例: 演目1→2の転換用)" style="margin-top:6px;" />
      <label class="pl-loop-label">
        <input type="checkbox" data-pl-idx="${i}" data-pl-loop ${pl.loop === false ? "" : "checked"} />
        最後まで流れたら繰り返す(オフだと1回流れたら無音のまま止まります)
      </label>
      <label class="pl-loop-label">
        <input type="checkbox" data-pl-idx="${i}" data-pl-combined ${isCombined ? "checked" : ""} />
        結合プレイリストにする(曲ではなく既存プレイリストを順番につなげる。例: A→Bと再生したいならAとBを追加)
      </label>
      ${totalLabel ? `<div class="playlist-total">${totalLabel}</div>` : ""}
      ${isCombined ? `
        <div class="bgm-playlist">
          ${sourceChips || '<span class="muted">(プレイリストが未登録です)</span>'}
        </div>
        <div class="bgm-add-row">
          <select data-pl-add-source="${i}">
            <option value="">+ プレイリストを追加...</option>
            ${availablePlaylistOptions}
          </select>
        </div>
      ` : `
        <div class="bgm-playlist">
          ${chips || '<span class="muted">(曲が未登録です)</span>'}
        </div>
        <div class="bgm-add-row">
          <select data-pl-add-track="${i}">
            <option value="">+ 曲を追加...</option>
            ${availableOptions}
          </select>
        </div>
      `}
    `;
    container.appendChild(card);
  });

  container.querySelectorAll("input[data-pl-field]").forEach(el => {
    el.addEventListener("change", async () => {
      const idx = Number(el.dataset.plIdx), field = el.dataset.plField;
      await fetch(`/api/playlists/${playlists[idx].id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ [field]: el.value }),
      });
      await refreshPlaylists();
    });
  });
  container.querySelectorAll("input[data-pl-loop]").forEach(el => {
    el.addEventListener("change", async () => {
      const idx = Number(el.dataset.plIdx);
      await fetch(`/api/playlists/${playlists[idx].id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ loop: el.checked }),
      });
      await refreshPlaylists();
    });
  });
  container.querySelectorAll("select[data-pl-add-track]").forEach(el => {
    el.addEventListener("change", async () => {
      if (!el.value) return;
      const pl = playlists[Number(el.dataset.plAddTrack)];
      await savePlaylistTracks(pl.id, [...(pl.trackIds || []), el.value]);
    });
  });
  container.querySelectorAll("input[data-pl-combined]").forEach(el => {
    el.addEventListener("change", async () => {
      const pl = playlists[Number(el.dataset.plIdx)];
      // オンにするときは(曲がまだ空でも)空配列を送って結合モードの表示に切り替える。
      // オフに戻すときはnullを送ってsourcePlaylistIds自体を消す(空配列[]を
      // 送ると「結合だが中身が空」と区別できず、チェックを外せなくなるため)。
      await savePlaylistSources(pl.id, el.checked ? (pl.sourcePlaylistIds || []) : null);
    });
  });
  container.querySelectorAll("select[data-pl-add-source]").forEach(el => {
    el.addEventListener("change", async () => {
      if (!el.value) return;
      const pl = playlists[Number(el.dataset.plAddSource)];
      await savePlaylistSources(pl.id, [...(pl.sourcePlaylistIds || []), el.value]);
    });
  });
  container.querySelectorAll("button[data-pl-src-remove]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const [i, ci] = btn.dataset.plSrcRemove.split(":").map(Number);
      const sourceIds = [...playlists[i].sourcePlaylistIds];
      sourceIds.splice(ci, 1);
      await savePlaylistSources(playlists[i].id, sourceIds);
    });
  });
  container.querySelectorAll("button[data-pl-src-up]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const [i, ci] = btn.dataset.plSrcUp.split(":").map(Number);
      if (ci === 0) return;
      const sourceIds = [...playlists[i].sourcePlaylistIds];
      [sourceIds[ci - 1], sourceIds[ci]] = [sourceIds[ci], sourceIds[ci - 1]];
      await savePlaylistSources(playlists[i].id, sourceIds);
    });
  });
  container.querySelectorAll("button[data-pl-src-down]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const [i, ci] = btn.dataset.plSrcDown.split(":").map(Number);
      const sourceIds = [...playlists[i].sourcePlaylistIds];
      if (ci >= sourceIds.length - 1) return;
      [sourceIds[ci + 1], sourceIds[ci]] = [sourceIds[ci], sourceIds[ci + 1]];
      await savePlaylistSources(playlists[i].id, sourceIds);
    });
  });
  container.querySelectorAll("button[data-pl-chip-remove]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const [i, ci] = btn.dataset.plChipRemove.split(":").map(Number);
      const trackIds = [...playlists[i].trackIds];
      trackIds.splice(ci, 1);
      await savePlaylistTracks(playlists[i].id, trackIds);
    });
  });
  container.querySelectorAll("button[data-pl-chip-up]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const [i, ci] = btn.dataset.plChipUp.split(":").map(Number);
      if (ci === 0) return;
      const trackIds = [...playlists[i].trackIds];
      [trackIds[ci - 1], trackIds[ci]] = [trackIds[ci], trackIds[ci - 1]];
      await savePlaylistTracks(playlists[i].id, trackIds);
    });
  });
  container.querySelectorAll("button[data-pl-chip-down]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const [i, ci] = btn.dataset.plChipDown.split(":").map(Number);
      const trackIds = [...playlists[i].trackIds];
      if (ci >= trackIds.length - 1) return;
      [trackIds[ci + 1], trackIds[ci]] = [trackIds[ci], trackIds[ci + 1]];
      await savePlaylistTracks(playlists[i].id, trackIds);
    });
  });
  container.querySelectorAll("button[data-pl-delete]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("このプレイリストを削除しますか?")) return;
      const r = await fetch(`/api/playlists/${btn.dataset.plDelete}`, { method: "DELETE" }).then(r => r.json());
      if (r.warning) alert(r.warning);
      await refreshPlaylists();
    });
  });
}

// プレイリストだけでなく曲単体も直接選べるようにする(わざわざプレイリストを
// 作らなくても1曲だけ流したい演目に対応するため)。<select>の値は "pl:<id>"
// (プレイリスト) / "tr:<id>" (単曲) のプレフィックス付きで区別し、選択時に
// playlistField/trackFieldのどちらか一方だけをセットする(他方はnullにする)。
function renderBgmPicker(item, idx, playlistField, trackField, playlistById, libraryById, legacyIds) {
  const selectedValue = item[trackField]
    ? `tr:${item[trackField]}`
    : (item[playlistField] ? `pl:${item[playlistField]}` : "");

  // 選択肢は(伏字にできる)表示用曲名ではなく内部の曲名で出す。運営がどの曲か
  // 確実に見分けて選べるようにするため(他の曲選択UIと同じ挙動に揃える)。
  const trackOptions = library.map(t =>
    `<option value="tr:${t.id}" ${selectedValue === `tr:${t.id}` ? "selected" : ""}>${escapeHtml(t.title)}</option>`
  ).join("");
  const playlistOptions = playlists.map(p =>
    `<option value="pl:${p.id}" ${selectedValue === `pl:${p.id}` ? "selected" : ""}>${escapeHtml(p.name)}</option>`
  ).join("");

  let previewHtml;
  const selectedTrack = item[trackField] ? libraryById[item[trackField]] : null;
  const selectedPlaylist = item[playlistField] ? playlistById[item[playlistField]] : null;
  if (selectedTrack) {
    previewHtml = `<div class="playlist-preview">${escapeHtml(selectedTrack.title)}</div>`;
  } else if (item[trackField]) {
    previewHtml = `<div class="playlist-preview empty">(曲が見つかりません: ${escapeHtml(item[trackField])})</div>`;
  } else if (selectedPlaylist) {
    const resolvedIds = Array.isArray(selectedPlaylist.sourcePlaylistIds)
      ? resolvePlaylistTrackIds(playlists, selectedPlaylist.id)
      : (selectedPlaylist.trackIds || []);
    const titles = resolvedIds
      .map(id => (libraryById[id] ? escapeHtml(libraryById[id].displayTitle) : "(見つかりません)"))
      .join(" → ");
    previewHtml = `<div class="playlist-preview">${titles || "(このプレイリストは空です)"}</div>`;
  } else if (item[playlistField]) {
    previewHtml = `<div class="playlist-preview empty">(プレイリストが見つかりません: ${escapeHtml(item[playlistField])})</div>`;
  } else if (legacyIds && legacyIds.length) {
    const titles = legacyIds
      .map(id => (libraryById[id] ? escapeHtml(libraryById[id].displayTitle) : "(見つかりません)"))
      .join(" → ");
    previewHtml = `<div class="playlist-preview">(旧形式の直接指定) ${titles}</div>`;
  } else {
    previewHtml = `<div class="playlist-preview empty">(BGMなし)</div>`;
  }

  return `
    <select data-idx="${idx}" data-playlist-field="${playlistField}" data-track-field="${trackField}">
      <option value="">(BGMなし)</option>
      <optgroup label="曲(単曲)">${trackOptions}</optgroup>
      <optgroup label="プレイリスト">${playlistOptions}</optgroup>
    </select>
    ${previewHtml}
  `;
}

// セクション(演目のグループ化)の折りたたみ状態。再描画をまたいで保持したいので
// renderProgram()の外(モジュールスコープ)に置く。保存はしない(ページを開き直すと
// 全展開に戻る。あくまで編集中の見た目の便宜のため)。
const collapsedSections = new Set();

// programを「隣接する同じ section 値の演目」でグループ化し、描画用のブロック列にする。
// section が空/未設定の演目はグループ化せず単独のブロックになる。
function buildProgramBlocks() {
  const blocks = [];
  let current = null;
  program.forEach((item, i) => {
    const sec = (item.section || "").trim();
    if (sec) {
      if (current && current.type === "section" && current.name === sec) {
        current.entries.push({ item, idx: i });
      } else {
        current = { type: "section", name: sec, entries: [{ item, idx: i }] };
        blocks.push(current);
      }
    } else {
      current = null;
      blocks.push({ type: "single", item, idx: i });
    }
  });
  return blocks;
}

function renderProgramItemRow(item, i, playlistById, libraryById) {
  const row = document.createElement("div");
  row.className = "program-item";

  const legacyBgm = !item.playlistId && !item.trackId && item.bgm
    ? (Array.isArray(item.bgm) ? item.bgm : [item.bgm])
    : [];

  row.innerHTML = `
    <span class="muted">#${i + 1}</span>
    <div class="program-item-main">
      <input type="text" value="${escapeAttr(item.name || "")}" data-idx="${i}" data-field="name" placeholder="演目名 (例: 劇『桃太郎』)" />
      <label class="playlist-picker-label">セクション (任意。隣接する演目に同じ名前を付けるとまとめて折りたためます)</label>
      <input type="text" class="section-field" value="${escapeAttr(item.section || "")}" data-idx="${i}" data-field="section" placeholder="例: 第一部" />
      <label class="playlist-picker-label">転換に使う曲/プレイリスト (この演目に入るとき)</label>
      ${renderBgmPicker(item, i, "playlistId", "trackId", playlistById, libraryById, legacyBgm)}
      <label class="playlist-picker-label">上演中に流す曲/プレイリスト (この演目の間ずっと)</label>
      ${renderBgmPicker(item, i, "performingPlaylistId", "performingTrackId", playlistById, libraryById, null)}
      <label style="display:block;margin-top:6px;">
        <input type="checkbox" data-idx="${i}" data-field="performingAutoplay" style="width:auto;display:inline-block;vertical-align:middle;" ${item.performingAutoplay ? "checked" : ""} />
        上演開始と同時にBGMを自動再生する (未チェック: 頭出しだけして、▶を押すまで鳴らさない)
      </label>
    </div>
    <button class="secondary" data-up="${i}" type="button">↑</button>
    <button class="secondary" data-down="${i}" type="button">↓</button>
    <button class="danger" data-remove="${i}" type="button">演目削除</button>
  `;
  return row;
}

function renderProgram() {
  const container = document.getElementById("program-list");
  container.innerHTML = "";
  const playlistById = Object.fromEntries(playlists.map(p => [p.id, p]));
  const libraryById = Object.fromEntries(library.map(t => [t.id, t]));

  buildProgramBlocks().forEach(block => {
    if (block.type === "single") {
      container.appendChild(renderProgramItemRow(block.item, block.idx, playlistById, libraryById));
      return;
    }
    const collapsed = collapsedSections.has(block.name);
    const wrap = document.createElement("div");
    wrap.className = "program-section" + (collapsed ? " collapsed" : "");

    const header = document.createElement("div");
    header.className = "program-section-header";
    header.innerHTML = `
      <button type="button" class="section-toggle" data-toggle-section="${escapeAttr(block.name)}">${collapsed ? "▸" : "▾"}</button>
      <strong>${escapeHtml(block.name)}</strong>
      <span class="muted">(${block.entries.length}演目)</span>
      <button type="button" class="secondary" data-add-to-section="${escapeAttr(block.name)}">+演目</button>
      <button type="button" class="secondary" data-rename-section="${escapeAttr(block.name)}">名前変更</button>
      <button type="button" class="danger" data-ungroup-section="${escapeAttr(block.name)}">セクション解除</button>
    `;
    wrap.appendChild(header);

    const body = document.createElement("div");
    body.className = "program-section-body";
    block.entries.forEach(({ item, idx }) => {
      body.appendChild(renderProgramItemRow(item, idx, playlistById, libraryById));
    });
    wrap.appendChild(body);

    container.appendChild(wrap);
  });

  container.querySelectorAll("input[type=text][data-field]").forEach(el => {
    el.addEventListener("input", () => {
      const idx = Number(el.dataset.idx), field = el.dataset.field;
      program[idx][field] = el.value;
    });
  });
  // セクション名は入力のたびに再描画するとフォーカスが飛ぶので、確定時(blur)だけ
  // グループ化をやり直す。
  container.querySelectorAll("input.section-field").forEach(el => {
    el.addEventListener("change", () => renderProgram());
  });
  container.querySelectorAll("[data-toggle-section]").forEach(btn => {
    btn.addEventListener("click", () => {
      const name = btn.dataset.toggleSection;
      if (collapsedSections.has(name)) collapsedSections.delete(name); else collapsedSections.add(name);
      renderProgram();
    });
  });
  container.querySelectorAll("[data-rename-section]").forEach(btn => {
    btn.addEventListener("click", () => {
      const oldName = btn.dataset.renameSection;
      const newName = prompt("セクション名を変更", oldName);
      if (newName === null) return;
      const trimmed = newName.trim();
      program.forEach(item => { if ((item.section || "").trim() === oldName) item.section = trimmed; });
      if (collapsedSections.has(oldName)) {
        collapsedSections.delete(oldName);
        if (trimmed) collapsedSections.add(trimmed);
      }
      renderProgram();
    });
  });
  container.querySelectorAll("[data-ungroup-section]").forEach(btn => {
    btn.addEventListener("click", () => {
      const name = btn.dataset.ungroupSection;
      if (!confirm(`「${name}」セクションを解除しますか?(演目自体は削除されません)`)) return;
      program.forEach(item => { if ((item.section || "").trim() === name) item.section = ""; });
      collapsedSections.delete(name);
      renderProgram();
    });
  });
  container.querySelectorAll("[data-add-to-section]").forEach(btn => {
    btn.addEventListener("click", () => {
      const name = btn.dataset.addToSection;
      let lastIdx = -1;
      program.forEach((item, i) => { if ((item.section || "").trim() === name) lastIdx = i; });
      program.splice(lastIdx + 1, 0, {
        name: "", section: name, playlistId: null, trackId: null,
        performingPlaylistId: null, performingTrackId: null, performingAutoplay: false,
      });
      renderProgram();
    });
  });
  container.querySelectorAll("select[data-playlist-field]").forEach(el => {
    el.addEventListener("change", () => {
      const idx = Number(el.dataset.idx);
      const plField = el.dataset.playlistField, trField = el.dataset.trackField;
      const val = el.value;
      if (val.startsWith("tr:")) {
        program[idx][trField] = val.slice(3);
        program[idx][plField] = null;
      } else if (val.startsWith("pl:")) {
        program[idx][plField] = val.slice(3);
        program[idx][trField] = null;
      } else {
        program[idx][plField] = null;
        program[idx][trField] = null;
      }
      renderProgram();
    });
  });
  container.querySelectorAll("input[type=checkbox][data-field]").forEach(el => {
    el.addEventListener("change", () => {
      const idx = Number(el.dataset.idx), field = el.dataset.field;
      program[idx][field] = el.checked;
    });
  });
  container.querySelectorAll("button[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => { program.splice(Number(btn.dataset.remove), 1); renderProgram(); });
  });
  container.querySelectorAll("button[data-up]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.up);
      if (i > 0) { [program[i - 1], program[i]] = [program[i], program[i - 1]]; renderProgram(); }
    });
  });
  container.querySelectorAll("button[data-down]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.down);
      if (i < program.length - 1) { [program[i + 1], program[i]] = [program[i], program[i + 1]]; renderProgram(); }
    });
  });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function formatDuration(sec) {
  if (sec == null || !Number.isFinite(sec)) return "?:??";
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const mm = h > 0 ? String(m).padStart(2, "0") : String(m);
  const ss = String(s).padStart(2, "0");
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

// ページ再読み込みでもボーカル除去の進捗表示が消えないように、サーバー側に
// 残っている実行中ジョブを引き継ぐ (ジョブ自体はサーバー側で継続していて、
// 単にブラウザ側の進捗管理(activeVocalJobs)がページと一緒に消えるだけだった)。
async function resumeActiveVocalJobs() {
  let runningJobs;
  try {
    runningJobs = await fetch("/api/jobs").then(r => r.json());
  } catch (e) {
    return;
  }
  for (const j of runningJobs) {
    if (j.trackId) activeVocalJobs[j.trackId] = { jobId: j.jobId, progress: j.progress ?? 0 };
  }
  for (const j of runningJobs) {
    if (j.trackId) pollVocalRemovalJob(j.trackId, j.jobId);
  }
}

(async () => {
  await resumeActiveVocalJobs();
  await refreshLibrary();
  await refreshPlaylists();
  await refreshProgram();
})();
</script>
