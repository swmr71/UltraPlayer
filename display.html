<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Now Playing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a12;
    color: #fff;
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    overflow: hidden;
  }
  #app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 40%, #1b1330 0%, #08060f 70%);
  }

  #status-badge {
    font-size: 4vw;
    letter-spacing: 0.3em;
    color: #7de1ff;
    margin-bottom: 3vh;
    opacity: 0.9;
    font-weight: 700;
  }
  #track-name {
    font-size: 11vw;
    font-weight: 800;
    text-align: center;
    line-height: 1.25;
    max-width: 94%;
    text-shadow: 0 0 40px rgba(125,225,255,0.5);
    white-space: nowrap;
  }
  #track-sub {
    font-size: 3.8vw;
    text-align: center;
    line-height: 1.3;
    opacity: 0.75;
    max-width: 90%;
    margin-top: 1vh;
  }
  #track-sub:empty { display: none; }

  #conn-error {
    position: fixed;
    bottom: 2vh;
    left: 2vw;
    font-size: 1.6vw;
    color: #ff6b6b;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #conn-error.show { opacity: 1; }

  /* 1画面構成では左右に分けられないため、動画がある演目は画面いっぱいに動画を表示する
     (演目名/BGM情報は動画を隠している間だけ非表示になる)。 */
  #video-el {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
    display: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="status-badge">STOPPED</div>
  <div id="track-name">-</div>
  <div id="track-sub"></div>
</div>
<video id="video-el" playsinline></video>
<div id="conn-error">接続待機中... (main.py が起動しているか確認してください)</div>

<script>
const API_URL = "/now-playing"; // main.py がこのページ自身も配信しているため相対パス
const POLL_MS = 700;

const appEl = document.getElementById("app");
const statusBadge = document.getElementById("status-badge");
const trackName = document.getElementById("track-name");
const trackSub = document.getElementById("track-sub");
const connError = document.getElementById("conn-error");
const videoEl = document.getElementById("video-el");
let lastVideoUrl = null;

// 1画面構成では動画を左右どちらかに寄せられないため、動画がある演目は
// 画面いっぱいに動画を表示し、演目名/BGM情報は隠す。
function showVideo(data) {
  appEl.style.display = "none";
  videoEl.style.display = "block";
  const video = data.video;
  if (lastVideoUrl !== video.url) {
    videoEl.src = video.url;
    videoEl.loop = true;
    lastVideoUrl = video.url;
  }
  videoEl.muted = Boolean(video.muted);
  if (video.syncPlayback) {
    if (data.playing && videoEl.paused) videoEl.play().catch(() => {});
    if (!data.playing && !videoEl.paused) videoEl.pause();
    syncVideoPosition(data.elapsed);
  } else if (videoEl.paused) {
    videoEl.play().catch(() => {});
  }
}

// BGMの再生位置(シークも含む)に動画の再生位置を合わせる。ポーリング間隔
// (700ms)程度の自然なズレは無視し、大きくズレたとき(シークされた・
// 動画の方が短くてループした等)だけ currentTime を合わせ直す
// (毎回合わせるとカクつくため)。動画がBGMより短い場合はループ前提で
// 経過秒数を動画の長さで割った余りに合わせる。
const VIDEO_SYNC_DRIFT_SEC = 0.75;
function syncVideoPosition(elapsedSec) {
  if (typeof elapsedSec !== "number" || !Number.isFinite(elapsedSec)) return;
  let target = elapsedSec;
  if (Number.isFinite(videoEl.duration) && videoEl.duration > 0) {
    target = target % videoEl.duration;
  }
  if (Math.abs(videoEl.currentTime - target) > VIDEO_SYNC_DRIFT_SEC) {
    videoEl.currentTime = target;
  }
}

function hideVideo() {
  if (videoEl.style.display === "none" || videoEl.style.display === "") return;
  videoEl.pause();
  videoEl.removeAttribute("src");
  videoEl.load();
  lastVideoUrl = null;
  videoEl.style.display = "none";
  appEl.style.display = "";
}

// 作者・「当方でBGM化(編集・二次利用)した音源」の注意書き・自由記述の注記を、
// 曲名の下に小さく表示するための1行にまとめる (著作権表示・出典明記のため)。
function formatTrackSub(track) {
  if (!track) return "";
  const parts = [];
  if (track.author) parts.push(track.author);
  if (track.arranged) parts.push("編集音源");
  if (track.note) parts.push(track.note);
  return parts.join(" / ");
}

// 上演中は主題が演目名になり曲名自体が画面から消えるため、説明欄には
// 曲名を先頭に足して「曲名 / 作者 / 編集音源 / 注記」の形にする。
function formatBgmLine(track) {
  if (!track) return "";
  return [track.title, formatTrackSub(track)].filter(Boolean).join(" / ");
}

function fitTrackName() {
  const maxWidth = appEl.clientWidth * 0.94;
  trackName.style.fontSize = "";
  let size = parseFloat(getComputedStyle(trackName).fontSize);
  while (trackName.scrollWidth > maxWidth && size > 12) {
    size -= 2;
    trackName.style.fontSize = size + "px";
  }
}

// main.py --program 利用時は {mode, current_item/next_item, bgm} 形式、
// 未使用時は {track: {title, author, arranged}, playing, ...} 形式で返る。
// どちらでも表示できるよう吸収する。
function extractNowPlaying(data) {
  if (data.mode === "transition") {
    // 無音転換(流す曲が無い)は画面がほぼ空になってしまうので、状態が一目で
    // 分かるよう「転換中」自体を(バッジと同じ水色で)大きく表示する。
    // タイトルと同じ文字なので、バッジ側は二重に見えないよう隠す。
    return data.bgm
      ? { title: data.bgm.title, statusText: "転換中", playing: true, sub: formatTrackSub(data.bgm) }
      : { title: "転換中", titleColor: "#7de1ff", statusText: "転換中", playing: false, sub: "", hideBadge: true };
  }
  // 未開始 (Nをまだ一度も押していない)。開演前で客席からスクリーンが見えている
  // 時間帯なので、最初の演目名を出しておく。この分岐が無いと下の返り値に落ちて
  // title が undefined になり、曲名が空欄のままバッジだけ "PAUSED" と出る。
  if (data.mode === "ready") {
    return { title: data.next_item, statusText: "まもなく開始", playing: false, sub: "" };
  }
  if (data.mode === "performing") {
    return { title: data.current_item, statusText: "上演中", playing: false, sub: formatBgmLine(data.bgm) };
  }
  const track = (data.track && typeof data.track === "object") ? data.track : null;
  return {
    title: track ? track.title : data.track,
    statusText: data.playing ? "NOW PLAYING" : "PAUSED",
    playing: Boolean(data.playing),
    sub: formatTrackSub(track),
  };
}

// 表示の組み立てで例外が出ても、ポーリングだけは死なせないためのラッパー。
// (読み込み時に throw すると setInterval の登録前にscriptが止まり、
//  画面が本番中ずっと固まったままになる)
function safe(label, fn) {
  try {
    fn();
  } catch (e) {
    console.error(`[display] ${label} に失敗しました`, e);
  }
}

async function poll() {
  let data;
  try {
    const res = await fetch(API_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("bad status");
    data = await res.json();
  } catch (e) {
    connError.classList.add("show");
    return;
  }
  connError.classList.remove("show");

  // 描画の失敗を通信エラー表示にはしない。ここを一緒くたにすると、
  // 表示のバグが「main.pyが落ちている」ように見えて切り分けができない。
  safe("描画", () => {
    if ((data.mode === "performing" || data.mode === "transition") && data.video) {
      showVideo(data);
      return;
    }
    hideVideo();
    const info = extractNowPlaying(data);
    trackName.textContent = info.title ?? "";
    trackName.style.color = info.titleColor || "";
    trackSub.textContent = info.sub || "";
    statusBadge.textContent = info.statusText;
    statusBadge.style.visibility = info.hideBadge ? "hidden" : "visible";
    appEl.classList.toggle("paused", !info.playing);

    fitTrackName();
  });
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
