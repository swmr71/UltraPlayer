<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>UltraPlayer - スマホでイヤモニ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #101018;
    color: #eee;
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #enable-overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    background: #101018;
    z-index: 50;
    text-align: center;
    padding: 24px;
  }
  #enable-overlay h1 { font-size: 18px; font-weight: 700; }
  #enable-overlay p { font-size: 13px; color: #999; max-width: 320px; line-height: 1.7; }
  #enable-overlay p.warn-note {
    color: #ff9d6b;
    background: rgba(224,120,69,0.1);
    border: 1px solid rgba(224,120,69,0.3);
    border-radius: 10px;
    padding: 10px 14px;
  }
  #enable-btn {
    margin-top: 8px;
    padding: 18px 36px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 999px;
    border: 1px solid rgba(125,225,255,0.4);
    background: rgba(125,225,255,0.14);
    color: #7de1ff;
  }
  #enable-btn:active { transform: scale(0.97); background: rgba(125,225,255,0.24); }

  #app {
    display: none;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px;
    text-align: center;
  }
  #status-ring {
    width: 150px; height: 150px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 3px solid rgba(255,255,255,0.1);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  #status-ring.waiting { border-color: rgba(125,225,255,0.35); }
  #status-ring.armed {
    border-color: #7de1ff;
    box-shadow: 0 0 24px rgba(125,225,255,0.35);
  }
  #status-ring.playing {
    border-color: #9fd6a8;
    box-shadow: 0 0 28px rgba(159,214,168,0.4);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  #status-icon { font-size: 46px; }
  #status-text { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
  #status-sub { font-size: 12.5px; color: #999; min-height: 1.4em; }
  #track-title { font-size: 13px; color: #7de1ff; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #volume-wrap { width: min(320px, 80vw); }
  #volume-row { display: flex; align-items: center; gap: 10px; }
  #volume-row span:first-child { font-size: 18px; }
  input[type="range"] { flex: 1; accent-color: #7de1ff; height: 28px; }

  #diag {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center; gap: 14px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    font-size: 11px; color: #666;
    font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,0.02);
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  #diag span b { color: #999; }
  #conn-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #e04545; margin-right: 4px;
  }
  #conn-dot.ok { background: #4ade80; }
</style>
</head>
<body>

<div id="enable-overlay">
  <h1>🎧 スマホでイヤモニ</h1>
  <p>
    タップして待機を開始すると、今本編で流れているBGMに合わせて自動的に
    イヤホンからこの端末専用の音声(イヤモニ用)が流れ始めます。以降は
    本編側の再生/一時停止/曲送りに自動で追従するので操作は不要です。
    画面ロックはせず、イヤホンを挿した状態でお待ちください。
  </p>
  <p class="warn-note">
    ⚠ 必ず<b>有線イヤホン</b>を使ってください。Bluetoothイヤホンは音声の遅延が
    大きく(機種により数十〜数百ms)、他の端末や生演奏との同期が確実にずれます。
  </p>
  <button id="enable-btn">タップして待機を開始</button>
</div>

<div id="app">
  <div id="status-ring" class="waiting">
    <span id="status-icon">⏳</span>
  </div>
  <div>
    <div id="status-text">同期を測定中...</div>
    <div id="status-sub">サーバーとの時刻合わせをしています</div>
    <div id="track-title"></div>
  </div>
  <div id="volume-wrap">
    <div id="volume-row">
      <span>🔊</span>
      <input type="range" id="volume-slider" min="0" max="100" value="100">
    </div>
  </div>
</div>

<div id="diag">
  <span><span id="conn-dot"></span><span id="conn-text">未接続</span></span>
  <span>誤差: <b id="diag-offset">-</b></span>
  <span>RTT: <b id="diag-rtt">-</b></span>
  <span>端末: <b id="diag-clients">-</b></span>
</div>

<script>
"use strict";
// main.py がこのページ自身も配信するため、相対パスで同じオリジンを指す
const TIME_URL = "/sync/time";
const FOLLOW_URL = "/sync/follow";
const POLL_MS = 700;
// これ以上ズレたら(ネットワークジッタ等ではなく本当に本編と食い違ったと判断し)
// 音声を止めて正しい位置から鳴らし直す(同期精度を最優先。小さなプチ音は許容)。
const RESYNC_THRESHOLD_SEC = 0.02;

const CLIENT_ID = (() => {
  try {
    let id = localStorage.getItem("ultraplayer_sync_cid");
    if (!id) {
      id = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
      localStorage.setItem("ultraplayer_sync_cid", id);
    }
    return id;
  } catch (e) {
    return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
  }
})();

const enableOverlay = document.getElementById("enable-overlay");
const enableBtn = document.getElementById("enable-btn");
const app = document.getElementById("app");
const statusRing = document.getElementById("status-ring");
const statusIcon = document.getElementById("status-icon");
const statusText = document.getElementById("status-text");
const statusSub = document.getElementById("status-sub");
const trackTitleEl = document.getElementById("track-title");
const volumeSlider = document.getElementById("volume-slider");
const connDot = document.getElementById("conn-dot");
const connText = document.getElementById("conn-text");
const diagOffset = document.getElementById("diag-offset");
const diagRtt = document.getElementById("diag-rtt");
const diagClients = document.getElementById("diag-clients");

let audioCtx = null;
let gainNode = null;

// --- クロック同期 (NTP風: 往復遅延が最小のサンプルほど信用できるオフセット推定になる) ---
let offsetMs = null;      // 推定 (サーバー時刻 - この端末のローカル時刻)
let bestRttMs = Infinity;

function localEpochNow() {
  // performance.now() は Date.now() よりドリフトが少なく分解能も高いので、
  // これを起点にした epoch 時刻をローカル時計の基準として使う。
  return performance.timeOrigin + performance.now();
}

async function sampleClockOffset() {
  const t0 = localEpochNow();
  let res;
  try {
    res = await fetch(TIME_URL, { cache: "no-store" });
  } catch (e) {
    return false;
  }
  const t2 = localEpochNow();
  if (!res.ok) return false;
  const data = await res.json();
  const rtt = t2 - t0;
  // 往復遅延の半分だけサーバー時刻が進んでいると仮定した中間点推定 (Cristianのアルゴリズム)。
  // 遅延が非対称だと誤差が乗るため、複数サンプルのうちRTTが最小のものだけ採用することで
  // ネットワークジッタの影響をできるだけ排除する。
  const estOffset = data.t - (t0 + t2) / 2;
  if (rtt <= bestRttMs) {
    bestRttMs = rtt;
    offsetMs = estOffset;
  } else if (offsetMs == null) {
    offsetMs = estOffset; // 初回はRTTが悪くても無いよりはまし
  } else {
    // 採用されなかったサンプルごとに「最良RTT」の基準を少しずつ緩める。
    // 緩めないと、開始直後にたまたま出た最小RTTを永久に更新できず、オフセットが
    // 開始時点の値で固まってしまう。端末とサーバーの時計は微妙にずれていく
    // (数十ppmでも1時間で百ms前後)ので、長い本番の途中で同期がじわじわ狂う。
    // 緩めて新しいサンプルが採用されれば、その後はまたRTTの小さいものだけが採用される。
    bestRttMs = bestRttMs * 1.1 + 0.1;
  }
  diagOffset.textContent = offsetMs != null ? `${offsetMs.toFixed(1)}ms` : "-";
  diagRtt.textContent = `${bestRttMs === Infinity ? rtt.toFixed(1) : bestRttMs.toFixed(1)}ms`;
  return true;
}

async function calibrateClock(rounds) {
  for (let i = 0; i < rounds; i++) {
    await sampleClockOffset();
    await new Promise(r => setTimeout(r, 60));
  }
}

// --- 音声の先読み・デコード ---
// 「今どのURLを追いかけているか」を audioUrl 単位で管理する(本編の曲が
// 切り替わればURLも変わるので、trackIdではなくaudioUrlの変化を見ればよい)。
let loadedAudioUrl = null;
let audioBuffer = null;
let loadingAudioUrl = null;
let loadingPromise = null;

// audioUrl の音声を読み込んでデコードする。完了(または失敗)で解決するPromiseを返す。
// 読み込み中に同じURLで再度呼ばれたら、そのPromiseをそのまま返す(ポーリングは700msごとで、
// モバイル回線だと読み込みに数秒かかるので、この間に何度も呼ばれる)。
function ensureAudioLoaded(audioUrl) {
  if (!audioUrl) return Promise.resolve();
  if (audioUrl === loadedAudioUrl && audioBuffer) return Promise.resolve();
  if (loadingAudioUrl === audioUrl && loadingPromise) return loadingPromise;

  // 別の曲へ切り替わる。前の曲のバッファは必ず捨てる。残しておくと、読み込み完了を
  // 待たずに続きの処理へ進んだポーリングが「前の曲の音声」を新しい曲の位置から
  // 鳴らしてしまい、演者のイヤモニに違う曲が流れる。
  audioBuffer = null;
  loadedAudioUrl = null;
  loadingAudioUrl = audioUrl;
  const promise = (async () => {
    try {
      const res = await fetch(audioUrl, { cache: "force-cache" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const arrBuf = await res.arrayBuffer();
      const decoded = await audioCtx.decodeAudioData(arrBuf);
      if (loadingAudioUrl !== audioUrl) return; // 読み込み中にさらに別の曲へ切り替わった。この結果は捨てる
      audioBuffer = decoded;
      loadedAudioUrl = audioUrl;
    } catch (e) {
      if (loadingAudioUrl === audioUrl) {
        audioBuffer = null;
        loadedAudioUrl = null;
      }
    } finally {
      if (loadingAudioUrl === audioUrl) {
        loadingAudioUrl = null;
        loadingPromise = null;
      }
    }
  })();
  loadingPromise = promise;
  return promise;
}

// --- 再生位置の追従 ---
// activeSource が鳴っている間、その開始時点の (ctxTime, bufferOffset) を覚えておき、
// 「今のはずの再生位置」と突き合わせて大きくズレたら鳴らし直す(ハード再同期)。
let activeSource = null;
let sourceStartCtxTime = null;   // このsourceをstart()したときの audioCtx.currentTime
let sourceStartOffset = null;    // そのときバッファのどこから鳴らし始めたか(秒)

function stopActiveSource() {
  if (activeSource) {
    try { activeSource.stop(); } catch (e) { /* 既に止まっている */ }
    activeSource = null;
  }
  sourceStartCtxTime = null;
  sourceStartOffset = null;
}

function startSourceAt(offsetSec) {
  stopActiveSource();
  if (!audioBuffer) return;
  const duration = audioBuffer.duration;
  let offset = offsetSec % duration; // 本編側がループしても追いつけるよう周期的に丸める
  if (offset < 0) offset = 0;
  const ctxNow = audioCtx.currentTime;
  const startAt = ctxNow + 0.03; // 発音までのごく短い猶予(0未満のstartを避けるため)
  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(gainNode);
  source.start(startAt, offset + 0.03);
  activeSource = source;
  sourceStartCtxTime = startAt;
  sourceStartOffset = offset + 0.03;
}

function currentSourcePositionSec() {
  if (!activeSource || sourceStartCtxTime == null) return null;
  return sourceStartOffset + (audioCtx.currentTime - sourceStartCtxTime);
}

function setStatus(mode, icon, text, sub) {
  statusRing.className = mode;
  statusIcon.textContent = icon;
  statusText.textContent = text;
  statusSub.textContent = sub;
}

// --- 本編の再生状態を継続的にポーリングして追従する ---
let pollSeq = 0;
async function pollFollow() {
  // 「タップして待機を開始」の前(AudioContext未作成)に、画面の表示切り替え
  // (visibilitychange)から呼ばれることがある。この状態で進むと音声のデコードに
  // 失敗して「読み込みに失敗」と出てしまうので何もしない。
  if (!audioCtx) return;
  const seq = ++pollSeq;
  let res;
  let data;
  try {
    res = await fetch(`${FOLLOW_URL}?cid=${encodeURIComponent(CLIENT_ID)}`, { cache: "no-store" });
    if (!res.ok) throw new Error("bad status");
    data = await res.json();
  } catch (e) {
    connDot.classList.remove("ok");
    connText.textContent = "未接続";
    return;
  }
  connDot.classList.add("ok");
  connText.textContent = "接続中";
  diagClients.textContent = typeof data.clientCount === "number" ? `${data.clientCount}台` : "-";

  if (!data.audioUrl) {
    stopActiveSource();
    audioBuffer = null;
    loadedAudioUrl = null;
    loadingAudioUrl = null; // 読み込み中の曲があっても、その結果は使わない
    loadingPromise = null;
    trackTitleEl.textContent = "";
    setStatus("waiting", "⏳", "待機中", "本編に曲がロードされていません");
    return;
  }

  trackTitleEl.textContent = `${data.usingFallback ? "🔁 " : "🎵 "}${data.title}`;

  if (data.audioUrl !== loadedAudioUrl) {
    // 曲が切り替わった。読み込み終わるまでは前の音を止めておく(誤った曲が鳴り続けるのを防ぐ)
    stopActiveSource();
    setStatus("waiting", "🎵", "音声を準備中...", data.title || "");
    await ensureAudioLoaded(data.audioUrl);
    // 読み込み中にこのポーリングより新しいポーリングが走っていたら、そちらの
    // (より新しい本編の状態に基づく)結果に任せる。古いdataで鳴らし始めない。
    if (seq !== pollSeq) return;
    if (loadedAudioUrl !== data.audioUrl || audioBuffer == null) {
      setStatus("waiting", "⚠", "音声の読み込みに失敗", "");
      return;
    }
  }
  if (offsetMs == null || !audioBuffer) return; // クロック同期・音声のどちらかがまだ準備できていない

  // サーバーが計測した時点(asOfServerMs)から今までに経過したぶんを足して、
  // 「サーバー視点で“今”のはずの再生位置」を推定する。
  const serverNowEstimate = localEpochNow() + offsetMs;
  const elapsedSincePollSec = Math.max(0, (serverNowEstimate - data.asOfServerMs) / 1000);
  const expectedSec = data.playing ? data.elapsedSec + elapsedSincePollSec : data.elapsedSec;

  if (!data.playing) {
    if (activeSource) stopActiveSource();
    setStatus("armed", "⏸", "一時停止中(本編に追従)", data.usingFallback ? "紐付けなし: 本編と同じ音声" : "");
    return;
  }

  if (!activeSource) {
    startSourceAt(expectedSec);
  } else {
    const actualSec = currentSourcePositionSec();
    const driftSec = actualSec == null ? Infinity : Math.abs(expectedSec - actualSec);
    if (driftSec > RESYNC_THRESHOLD_SEC) {
      startSourceAt(expectedSec); // ズレが大きいので鳴らし直す(小さなプチ音より同期精度を優先)
    }
  }
  setStatus("playing", "🔊", "再生中(本編に追従)", data.usingFallback ? "紐付けなし: 本編と同じ音声" : "");
}

// --- 音量 ---
volumeSlider.addEventListener("input", () => {
  if (gainNode) gainNode.gain.value = volumeSlider.value / 100;
});

// --- 画面点灯を保つ(可能なら)。取れなくても致命的ではないので無視 ---
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) { /* 対応していない/拒否された場合は諦める */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    requestWakeLock();
    // 画面ロック等でAudioContextが一時停止していると currentTime が止まって
    // いた間ズレが蓄積しているはずなので、resume() 後すぐにポーリングし直して
    // 大きなドリフトを検知させ、ハード再同期させる。
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().then(pollFollow);
    } else {
      pollFollow();
    }
  }
});

// --- 起動 (ユーザー操作必須: AudioContextのアンロックのため) ---
enableBtn.addEventListener("click", async () => {
  enableOverlay.style.display = "none";
  app.style.display = "flex";

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  gainNode = audioCtx.createGain();
  gainNode.gain.value = volumeSlider.value / 100;
  gainNode.connect(audioCtx.destination);

  requestWakeLock();

  setStatus("waiting", "📡", "同期を測定中...", "サーバーとの時刻合わせをしています");
  await calibrateClock(15);

  pollFollow();
  setInterval(pollFollow, POLL_MS);
  setInterval(sampleClockOffset, 4000); // 開始後も常時オフセットを更新し続ける(ズレ検知の精度向上のため)
}, { once: true });
</script>
</body>
</html>
